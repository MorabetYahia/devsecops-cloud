alertmanager:
  enabled: false
# Composants du plan de contrôle gérés par Azure : non accessibles sur AKS
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
prometheus:
  prometheusSpec:
    retention: 6h
    serviceMonitorSelectorNilUsesHelmValues: false  # lit tous les ServiceMonitor
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 768Mi }
grafana:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
