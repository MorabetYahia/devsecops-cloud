name: CI/CD DevSecOps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/morabetyahia/devsecops-app

jobs:
  tests:
    name: 0. Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Installer les dépendances
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Lancer les tests
        working-directory: app
        run: pytest -v

  secrets-scan:
    name: 1. Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: 2. SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config p/python --config p/dockerfile --error

  iac-scan:
    name: 3. IaC (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Installer Checkov
        run: pip install checkov
      - name: Scanner Terraform, Kubernetes et Dockerfile (non bloquant)
        run: |
          checkov -d . --framework terraform kubernetes dockerfile \
            --soft-fail --output cli --output sarif --output-file-path console,checkov
      - name: Publier dans l'onglet Security
        if: always() && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: checkov }

  build-scan-push:
    name: 4. Build, scan Trivy, push GHCR
    needs: [tests, secrets-scan, sast, iac-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t $IMAGE:${{ github.sha }} app/
      - name: Scan image (bloque si CRITICAL/HIGH corrigeable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: 5. Déploiement AKS
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && vars.CLUSTER_UP == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # autorise GitHub à émettre le jeton OIDC
    steps:
      - uses: actions/checkout@v5
      - name: Connexion Azure (OIDC, sans secret)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - name: Accès au cluster
        run: az aks get-credentials -g devsecops-rg -n devsecops-aks --overwrite-existing
      - name: Déployer la version du commit
        run: |
          sed -i "s|$IMAGE:latest|$IMAGE:${GITHUB_SHA}|" k8s/deployment.yaml
          sed -i "s|value: \"dev\"|value: \"${GITHUB_SHA::7}\"|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl rollout status deployment/devsecops-app --timeout=180s
          kubectl get pods,svc -o wide
